<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oosmafeats</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: #eee;
  font-family: Arial, sans-serif;
}

header {
  padding: 45px 7% 30px;
  border-bottom: 1px solid #25252c;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.logo {
  font-size: 36px;
  font-weight: bold;
}

.subtitle {
  color: #888;
  margin-top: 6px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

#authStatus {
  color: #888;
  font-size: 13px;
}

main {
  width: min(1100px, 86%);
  margin: 30px auto;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

input,
select,
textarea,
button {
  font: inherit;
  border: 1px solid #303039;
  background: #15151b;
  color: white;
  border-radius: 9px;
  padding: 11px 13px;
}

.search {
  flex: 1;
  min-width: 220px;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.add {
  background: white;
  color: black;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 16px;
}

/* =========================
   FEAT CARD
========================= */

.card {
  position: relative;
  overflow: hidden;
  background: #121217;
  border: 1px solid #292931;
  border-radius: 14px;
  padding: 20px;
  min-height: 250px;
}

/* THUMBNAIL */

.card::before {
  content: "";
  position: absolute;
  inset: 0;

  background-image: var(--thumbnail);
  background-size: cover;
  background-position: center;

  opacity: 0.75;

  z-index: 0;
}

/* DARK OVERLAY */

.card::after {
  content: "";
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, 0.25);

  z-index: 1;
}

/* CONTENT ABOVE IMAGE */

.card > * {
  position: relative;
  z-index: 2;
}

.game {
  color: #ddd;
  font-size: 13px;
  text-shadow: 0 1px 3px #000;
}

.name {
  font-size: 21px;
  font-weight: bold;
  margin: 8px 0 13px;
  text-shadow: 0 1px 4px #000;
}

.pill {
  display: inline-block;
  background: rgba(20, 20, 25, 0.85);
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 12px;
  margin-right: 5px;
}

.description {
  color: #eee;
  line-height: 1.5;
  margin: 15px 0;
  text-shadow: 0 1px 3px #000;
}

.actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.actions button {
  font-size: 12px;
  padding: 7px 10px;
}

.proof {
  color: #bbb;
  text-decoration: none;
}

.empty {
  text-align: center;
  color: #777;
  padding: 70px 10px;
  border: 1px dashed #292931;
  border-radius: 14px;
  grid-column: 1 / -1;
}

/* =========================
   IMAGE UPLOAD
========================= */

.image-upload {
  display: grid;
  gap: 8px;
}

.image-upload input[type="file"] {
  width: 100%;
  padding: 10px;
  cursor: pointer;
}

.image-preview {
  display: none;
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #303039;
}

.image-preview.show {
  display: block;
}

.image-help {
  color: #777;
  font-size: 11px;
}

/* =========================
   MODALS
========================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000b;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: min(520px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #111116;
  border: 1px solid #292931;
  border-radius: 16px;
  padding: 25px;
}

.modal-box h2 {
  margin-top: 0;
}

form {
  display: grid;
  gap: 12px;
}

label {
  color: #999;
  font-size: 12px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.form-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.error {
  color: #ff7777;
  font-size: 13px;
  display: none;
}

@media(max-width: 600px) {
  .row {
    grid-template-columns: 1fr;
  }

  header {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>

  <div>
    <div class="logo">OOSMAFEATS</div>
    <div class="subtitle">All my feats.</div>
  </div>

  <div class="header-actions">

    <span id="authStatus">
      Not logged in
    </span>

    <button
      id="authButton"
      type="button"
      onclick="openAuthModal()"
    >
      Login
    </button>

  </div>

</header>

<main>

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search feats or games..."
    >

    <select id="filter">
      <option value="">All difficulties</option>
      <option>Easy</option>
      <option>Normal</option>
      <option>Hard</option>
      <option>Insane</option>
      <option>Extreme</option>
    </select>

    <button
      id="addButton"
      class="add"
      type="button"
      onclick="handleAddClick()"
    >
      + Add Feat
    </button>

  </div>

  <div id="grid" class="grid"></div>

</main>

<!-- FEAT MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">Add Feat</h2>

    <form id="featForm">

      <input type="hidden" id="editId">

      <div class="row">

        <div>
          <label>FEAT NAME</label>

          <input
            id="name"
            required
            placeholder="Example: Dark Souls II SL1"
          >
        </div>

        <div>
          <label>GAME</label>

          <input
            id="game"
            required
            placeholder="Example: Dark Souls II"
          >
        </div>

      </div>

      <div class="row">

        <div>
          <label>DIFFICULTY</label>

          <select id="difficulty">
            <option>Easy</option>
            <option>Normal</option>
            <option>Hard</option>
            <option>Insane</option>
            <option>Extreme</option>
          </select>
        </div>

        <div>
          <label>DATE COMPLETED</label>

          <input
            id="date"
            type="date"
          >
        </div>

      </div>

      <div>

        <label>DESCRIPTION</label>

        <textarea
          id="description"
          placeholder="Describe the feat..."
        ></textarea>

      </div>

      <div>

        <label>PROOF URL</label>

        <input
          id="proof"
          type="url"
          placeholder="https://youtube.com/..."
        >

      </div>

      <div class="image-upload">

        <label>CUSTOM THUMBNAIL</label>

        <input
          id="thumbnailFile"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/gif"
        >

        <div class="image-help">
          Upload an image to use as the feat card background.
          If you upload one, it will override the YouTube thumbnail.
        </div>

        <img
          id="imagePreview"
          class="image-preview"
          alt="Thumbnail preview"
        >

      </div>

      <div class="form-buttons">

        <button
          type="button"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="add"
          type="submit"
          id="saveButton"
        >
          Save Feat
        </button>

      </div>

    </form>

  </div>

</div>

<!-- LOGIN MODAL -->

<div id="authModal" class="modal">

  <div class="modal-box">

    <h2>Login</h2>

    <form id="authForm">

      <div>

        <label>EMAIL</label>

        <input
          id="authEmail"
          type="email"
          required
          placeholder="Your email"
        >

      </div>

      <div>

        <label>PASSWORD</label>

        <input
          id="authPassword"
          type="password"
          required
          placeholder="Your password"
        >

      </div>

      <div
        id="authError"
        class="error"
      ></div>

      <div class="form-buttons">

        <button
          type="button"
          onclick="closeAuthModal()"
        >
          Cancel
        </button>

        <button
          class="add"
          type="submit"
        >
          Login
        </button>

      </div>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://qptsfclqcoqmlsegkbpt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_HN6LCZdOXz1Y2jNwBFOzCg_qipdKvev";

const OWNER_ID =
  "d308964b-015f-48f1-a9b2-196c6812f654";

const IMAGE_BUCKET =
  "feat-images";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let feats = [];
let currentUser = null;
let selectedThumbnailFile = null;


/* =========================
   AUTH
========================= */

async function checkAuth() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();

  currentUser =
    session ? session.user : null;

  updateAuthUI();
}


supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    currentUser =
      session ? session.user : null;

    updateAuthUI();
    render();

  }
);


function updateAuthUI() {

  const status =
    document.getElementById("authStatus");

  const button =
    document.getElementById("authButton");

  const addButton =
    document.getElementById("addButton");

  if (
    currentUser &&
    currentUser.id === OWNER_ID
  ) {

    status.textContent =
      "Logged in";

    button.textContent =
      "Logout";

    button.onclick =
      logout;

    addButton.disabled =
      false;

  } else {

    status.textContent =
      "Not logged in";

    button.textContent =
      "Login";

    button.onclick =
      openAuthModal;

    addButton.disabled =
      true;

  }

}


function openAuthModal() {

  document
    .getElementById("authModal")
    .classList.add("open");

  document
    .getElementById("authEmail")
    .focus();

}


function closeAuthModal() {

  document
    .getElementById("authModal")
    .classList.remove("open");

  document
    .getElementById("authError")
    .style.display =
      "none";

}


async function logout() {

  const { error } =
    await supabaseClient.auth.signOut();

  if (error) {

    alert(
      "Logout failed: " +
      error.message
    );

  }

}


document
  .getElementById("authForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const email =
        document
          .getElementById("authEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("authPassword")
          .value;

      const errorBox =
        document.getElementById("authError");

      errorBox.style.display =
        "none";

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        errorBox.textContent =
          error.message;

        errorBox.style.display =
          "block";

        return;

      }

      if (
        !data.user ||
        data.user.id !== OWNER_ID
      ) {

        await supabaseClient.auth.signOut();

        errorBox.textContent =
          "This account is not authorized.";

        errorBox.style.display =
          "block";

        return;

      }

      closeAuthModal();

    }
  );


/* =========================
   LOAD FEATS
========================= */

async function loadFeats() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("feats")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(
      "Failed to load feats:",
      error
    );

    document.getElementById("grid").innerHTML = `
      <div class="empty">
        Failed to load feats.<br><br>
        Check the browser console for details.
      </div>
    `;

    return;
  }

  feats =
    data || [];

  render();

}


/* =========================
   ADD / EDIT
========================= */

function handleAddClick() {

  if (!currentUser) {

    openAuthModal();
    return;

  }

  if (
    currentUser.id !== OWNER_ID
  ) {

    alert(
      "You are not authorized."
    );

    return;

  }

  openModal();

}


function openModal(id = null) {

  if (
    !currentUser ||
    currentUser.id !== OWNER_ID
  ) {

    openAuthModal();
    return;

  }

  document
    .getElementById("modal")
    .classList.add("open");

  document
    .getElementById("editId")
    .value =
    id !== null
      ? String(id)
      : "";

  document
    .getElementById("modalTitle")
    .textContent =
    id !== null
      ? "Edit Feat"
      : "Add Feat";

  selectedThumbnailFile =
    null;

  document
    .getElementById("thumbnailFile")
    .value =
    "";

  const preview =
    document.getElementById("imagePreview");

  preview.src = "";
  preview.classList.remove("show");

  if (id !== null) {

    const feat =
      feats.find(
        f =>
          String(f.id) === String(id)
      );

    if (!feat) {

      closeModal();
      return;

    }

    document.getElementById("name").value =
      feat.name || "";

    document.getElementById("game").value =
      feat.game || "";

    document.getElementById("difficulty").value =
      feat.difficulty || "Normal";

    document.getElementById("date").value =
      feat.date || "";

    document.getElementById("description").value =
      feat.description || "";

    document.getElementById("proof").value =
      feat.proof_url || "";

    if (feat.thumbnail_url) {

      preview.src =
        feat.thumbnail_url;

      preview.classList.add("show");

    }

  } else {

    document
      .getElementById("featForm")
      .reset();

  }

  document
    .getElementById("name")
    .focus();

}


function closeModal() {

  document
    .getElementById("modal")
    .classList.remove("open");

}


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("thumbnailFile")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if (!file) {

        selectedThumbnailFile =
          null;

        return;

      }

      if (
        !file.type.startsWith("image/")
      ) {

        alert(
          "Please select an image file."
        );

        event.target.value =
          "";

        return;

      }

      if (
        file.size > 10 * 1024 * 1024
      ) {

        alert(
          "Image must be smaller than 10 MB."
        );

        event.target.value =
          "";

        return;

      }

      selectedThumbnailFile =
        file;

      const reader =
        new FileReader();

      reader.onload =
        e => {

          const preview =
            document.getElementById(
              "imagePreview"
            );

          preview.src =
            e.target.result;

          preview.classList.add(
            "show"
          );

        };

      reader.readAsDataURL(file);

    }
  );


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadThumbnail(
  file,
  featId
) {

  if (!file) {
    return null;
  }

  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth.getSession();

  if (sessionError) {
    throw sessionError;
  }

  const session =
    sessionData.session;

  if (!session) {
    throw new Error(
      "Your login session has expired. Please log in again."
    );
  }

  if (
    session.user.id !== OWNER_ID
  ) {
    throw new Error(
      "You are not authorized to upload images."
    );
  }

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const filePath =
    session.user.id +
    "/" +
    featId +
    "-" +
    Date.now() +
    "." +
    extension;

  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from(IMAGE_BUCKET)
      .upload(
        filePath,
        file,
        {
          upsert: false,
          contentType: file.type,
          cacheControl: "3600"
        }
      );

  if (uploadError) {

    console.error(
      "Image upload failed:",
      uploadError
    );

    throw uploadError;

  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from(IMAGE_BUCKET)
      .getPublicUrl(
        filePath
      );

  if (
    !data ||
    !data.publicUrl
  ) {

    throw new Error(
      "Image uploaded, but no public URL was returned."
    );

  }

  return data.publicUrl;

}


/* =========================
   SAVE FEAT
========================= */

document
  .getElementById("featForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (
        !currentUser ||
        currentUser.id !== OWNER_ID
      ) {

        alert(
          "You must be logged in as the owner."
        );

        return;

      }

      const saveButton =
        document.getElementById(
          "saveButton"
        );

      saveButton.disabled =
        true;

      saveButton.textContent =
        "Saving...";

      try {

        const id =
          document
            .getElementById("editId")
            .value;

        const featData = {

          name:
            document
              .getElementById("name")
              .value
              .trim(),

          game:
            document
              .getElementById("game")
              .value
              .trim(),

          difficulty:
            document
              .getElementById("difficulty")
              .value,

          date:
            document
              .getElementById("date")
              .value ||
            null,

          description:
            document
              .getElementById("description")
              .value
              .trim(),

          proof_url:
            document
              .getElementById("proof")
              .value
              .trim() ||
            null

        };

        let savedFeatId =
          id;

        /* ADD */

        if (!id) {

          const {
            data,
            error
          } =
            await supabaseClient
              .from("feats")
              .insert(
                featData
              )
              .select()
              .single();

          if (error) {
            throw error;
          }

          savedFeatId =
            data.id;

        }

        /* EDIT */

        else {

          const {
            error
          } =
            await supabaseClient
              .from("feats")
              .update(
                featData
              )
              .eq(
                "id",
                id
              );

          if (error) {
            throw error;
          }

        }

        /* UPLOAD THUMBNAIL */

        if (
          selectedThumbnailFile
        ) {

          const thumbnailURL =
            await uploadThumbnail(
              selectedThumbnailFile,
              savedFeatId
            );

          const {
            error
          } =
            await supabaseClient
              .from("feats")
              .update({
                thumbnail_url:
                  thumbnailURL
              })
              .eq(
                "id",
                savedFeatId
              );

          if (error) {
            throw error;
          }

        }

        closeModal();

        selectedThumbnailFile =
          null;

        await loadFeats();

      } catch (error) {

        console.error(
          "Failed to save feat:",
          error
        );

        alert(
          "Failed to save feat:\n\n" +
          error.message
        );

      } finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "Save Feat";

      }

    }
  );


/* =========================
   DELETE
========================= */

async function deleteFeat(id) {

  if (
    !currentUser ||
    currentUser.id !== OWNER_ID
  ) {

    alert(
      "You must be logged in as the owner."
    );

    return;

  }

  if (
    !confirm(
      "Delete this feat?"
    )
  ) {

    return;

  }

  const {
    error
  } =
    await supabaseClient
      .from("feats")
      .delete()
      .eq(
        "id",
        id
      );

  if (error) {

    console.error(
      "Failed to delete feat:",
      error
    );

    alert(
      "Failed to delete feat:\n\n" +
      error.message
    );

    return;

  }

  await loadFeats();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  return String(text).replace(
    /[&<>"']/g,
    char => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    })[char]
  );

}


/* =========================
   SAFE URL
========================= */

function safeURL(value) {

  if (!value) {
    return "";
  }

  try {

    const url =
      new URL(value);

    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {

      return url.href;

    }

  } catch (error) {
  }

  return "";

}


/* =========================
   YOUTUBE THUMBNAIL
========================= */

function getYouTubeThumbnail(value) {

  if (!value) {
    return "";
  }

  try {

    const url =
      new URL(value);

    let videoId =
      "";

    if (
      url.hostname.includes(
        "youtube.com"
      )
    ) {

      videoId =
        url.searchParams.get("v") ||
        "";

      if (
        !videoId &&
        url.pathname.startsWith(
          "/shorts/"
        )
      ) {

        videoId =
          url.pathname
            .split("/shorts/")[1]
            .split("/")[0];

      }

      if (
        !videoId &&
        url.pathname.startsWith(
          "/embed/"
        )
      ) {

        videoId =
          url.pathname
            .split("/embed/")[1]
            .split("/")[0];

      }

    }

    if (
      url.hostname === "youtu.be"
    ) {

      videoId =
        url.pathname
          .replace("/", "")
          .split("/")[0];

    }

    if (!videoId) {
      return "";
    }

    return (
      "https://img.youtube.com/vi/" +
      encodeURIComponent(videoId) +
      "/hqdefault.jpg"
    );

  } catch (error) {

    return "";

  }

}


/* =========================
   RENDER
========================= */

function render() {

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const difficulty =
    document
      .getElementById("filter")
      .value;

  const filtered =
    feats.filter(
      feat => {

        const matchesSearch =
          !query ||
          (
            (feat.name || "") +
            " " +
            (feat.game || "") +
            " " +
            (feat.description || "")
          )
          .toLowerCase()
          .includes(query);

        const matchesDifficulty =
          !difficulty ||
          feat.difficulty ===
            difficulty;

        return (
          matchesSearch &&
          matchesDifficulty
        );

      }
    );

  const grid =
    document.getElementById(
      "grid"
    );

  if (!filtered.length) {

    grid.innerHTML = `
      <div class="empty">

        No feats yet.

        <br><br>

        ${
          currentUser
            ? 'Click <b>+ Add Feat</b> to add one.'
            : 'Login to add a feat.'
        }

      </div>
    `;

    return;

  }

  grid.innerHTML =
    filtered
      .map(
        feat => {

          const proofURL =
            safeURL(
              feat.proof_url
            );

          /*
           * CUSTOM THUMBNAIL FIRST
           * YOUTUBE THUMBNAIL SECOND
           */

          const thumbnail =
            safeURL(
              feat.thumbnail_url
            ) ||
            getYouTubeThumbnail(
              feat.proof_url
            );

          /*
           * CSS VARIABLE CONTAINS
           * THE IMAGE URL
           */

          const thumbnailStyle = thumbnail
  ? `--thumbnail: url(${thumbnail});`
  : `--thumbnail: none;`;

          return `

            <article
              class="card"
              style="${thumbnailStyle}"
            >

              <div class="game">
                ${escapeHTML(
                  feat.game || ""
                )}
              </div>

              <div class="name">
                ${escapeHTML(
                  feat.name || ""
                )}
              </div>

              <div>

                <span class="pill">
                  ${escapeHTML(
                    feat.difficulty || ""
                  )}
                </span>

                ${
                  feat.date
                    ? `
                      <span class="pill">
                        ${escapeHTML(
                          feat.date
                        )}
                      </span>
                    `
                    : ""
                }

              </div>

              ${
                feat.description
                  ? `
                    <div class="description">
                      ${escapeHTML(
                        feat.description
                      )}
                    </div>
                  `
                  : ""
              }

              <div class="actions">

                ${
                  proofURL
                    ? `
                      <a
                        class="proof"
                        href="${escapeHTML(
                          proofURL
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        <button type="button">
                          Proof ↗
                        </button>
                      </a>
                    `
                    : ""
                }

                ${
                  currentUser &&
                  currentUser.id === OWNER_ID
                    ? `
                      <button
                        type="button"
                        onclick="openModal('${feat.id}')"
                      >
                        Edit
                      </button>

                      <button
                        type="button"
                        onclick="deleteFeat('${feat.id}')"
                      >
                        Delete
                      </button>
                    `
                    : ""
                }

              </div>

            </article>

          `;

        }
      )
      .join("");

}


/* =========================
   SEARCH / FILTER
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );

document
  .getElementById("filter")
  .addEventListener(
    "change",
    render
  );


/* =========================
   MODAL BACKDROPS
========================= */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "modal"
      ) {

        closeModal();

      }

    }
  );

document
  .getElementById("authModal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "authModal"
      ) {

        closeAuthModal();

      }

    }
  );


/* =========================
   START
========================= */

async function startApp() {

  await checkAuth();
  await loadFeats();

}

startApp();

</script>

</body>
</html>
