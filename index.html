  <style>
    * {
      box-sizing: border-box;
    }

    body {

  </style>
</head>

<body>

<div class="container">

  <h1>OOSMAFEATS</h1>

  </div>

<!-- FEAT MODAL -->

<div class="modal" id="featModal">

  <div class="modal-box">

    <h2 id="modalTitle">Add Feat</h2>

    <input id="editId" type="hidden">

    <div class="form-group">
      <label>Name</label>
      <input id="featName">
    </div>

    <div class="form-group">
      <label>Game</label>
      <input id="featGame">
    </div>

    <div class="form-group">
      <label>Difficulty</label>

      <select id="featDifficulty">
        <option value="Impossible">Impossible</option>
        <option value="Extreme">Extreme</option>
        <option value="Insane">Insane</option>

        Save
      </button>

        Cancel
      </button>

    <div id="saveError" style="color:#ff6666;margin-top:12px;"></div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://qptsfclqcoqmlsegkbpt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_HN6LCZdOXz1Y2jNwBFOzCg_qipdKvev";

  const OWNER_ID =
    "d308964b-015f-48f1-a9b2-196c6812f654";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     STATE
  ========================= */

  let feats = [];
  let currentUser = null;


  const difficultyOrder = [
    "Impossible",
    "Extreme",
    "Insane",
    "Very Hard",
    "Hard",
    "Normal",
    "Easy",
    "Simple"
  ];


  /* =========================
     AUTH
  ========================= */

  async function checkAuth() {

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      console.error(error);
      return;
    }

    currentUser = data.session
      ? data.session.user
      : null;

    updateAuthUI();
  }


  function updateAuthUI() {

    const loggedIn =
      currentUser &&
      currentUser.id === OWNER_ID;

    document.getElementById("loginButton").style.display =
      loggedIn ? "none" : "block";

    document.getElementById("logoutButton").style.display =
      loggedIn ? "block" : "none";

    document.getElementById("addButton").style.display =
      loggedIn ? "block" : "none";

    document.getElementById("userStatus").textContent =
      loggedIn ? "Logged in" : "";
  }


  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const errorBox =
      document.getElementById("loginError");

    errorBox.textContent = "";

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {

      errorBox.textContent =
        error.message;

      return;
    }

    currentUser = data.user;

    updateAuthUI();

    closeLoginModal();

    await loadFeats();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    updateAuthUI();
  }


  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      currentUser =
        session ? session.user : null;

      updateAuthUI();

    }
  );


  /* =========================
     LOAD FEATS
  ========================= */

  async function loadFeats() {

    const {
      data,
      error
    } = await supabaseClient
      .from("feats")
      .select("*");

    if (error) {

      console.error("Load error:", error);

      document.getElementById("featList").innerHTML =
        `<div class="empty">
          Error loading feats.<br>
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }

    feats = data || [];

    render();
  }


  /* =========================
     ORDERING
  ========================= */

  function getTierFeats(difficulty) {

    return feats
      .filter(
        feat => feat.difficulty === difficulty
      )
      .sort((a, b) => {

        const aPlacement =
          a.placement == null
            ? Infinity
            : Number(a.placement);

        const bPlacement =
          b.placement == null
            ? Infinity
            : Number(b.placement);

        if (aPlacement !== bPlacement) {
          return aPlacement - bPlacement;
        }

        const aDate =
          new Date(a.created_at || 0).getTime();

        const bDate =
          new Date(b.created_at || 0).getTime();

        return aDate - bDate;
      });
  }


  function getAllOrderedFeats() {

    const result = [];

    for (const difficulty of difficultyOrder) {

      const tier =
        getTierFeats(difficulty);

      result.push(...tier);
    }

    return result;
  }


  /* =========================
     RENDER
  ========================= */

  function render() {

    const search =
      document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filter =
      document.getElementById("difficultyFilter")
        .value;

    const ordered =
      getAllOrderedFeats();

    const globalRanks =
      new Map();

    ordered.forEach((feat, index) => {

      globalRanks.set(
        String(feat.id),
        index + 1
      );

    });


    let html = "";

    for (const difficulty of difficultyOrder) {

      if (
        filter !== "all" &&
        filter !== difficulty
      ) {
        continue;
      }

      let tier =
        getTierFeats(difficulty);

      tier =
        tier.filter(feat => {

          const text = [
            feat.name,
            feat.game,
            feat.description,
            feat.difficulty
          ]
          .join(" ")
          .toLowerCase();

          return text.includes(search);
        });


      if (tier.length === 0) {
        continue;
      }


      html += `
        <div class="tier-title">
          ${difficulty.toUpperCase()}
        </div>
      `;


      const fullTier =
        getTierFeats(difficulty);


      tier.forEach(feat => {

        const tierIndex =
          fullTier.findIndex(
            f => String(f.id) === String(feat.id)
          );

        const canMoveUp =
          tierIndex > 0;

        const canMoveDown =
          tierIndex < fullTier.length - 1;

        const rank =
          globalRanks.get(String(feat.id));


        const thumbnail =
          feat.thumbnail_url
            ? `--thumbnail: url(${feat.thumbnail_url});`
            : `--thumbnail: none;`;


        const proofAttr =
          feat.proof_url
            ? escapeAttribute(feat.proof_url)
            : "";

        const clickableClass =
          feat.proof_url ? " clickable" : "";

        html += `

          <div
            class="feat${clickableClass}"
            data-proof-url="${proofAttr}"
          >

            <div class="placement">
              #${rank}
            </div>

            <div class="feat-content">

              <div class="feat-title">
                ${escapeHtml(feat.name || "Unnamed Feat")}
              </div>

              ${
                feat.game
                  ? `<div class="game">
                      ${escapeHtml(feat.game)}
                    </div>`
                  : ""
              }

              ${
                feat.description
                  ? `<div class="description">${escapeHtml(feat.description.trim())}</div>`
                  : ""
              }

              <div class="meta">

                <span class="tag">
                  ${escapeHtml(feat.difficulty || "")}
                </span>

                ${
                  feat.date
                    ? `<span class="tag">
                        ${escapeHtml(feat.date)}
                       </span>`
                    : ""
                }

              </div>


              ${
                currentUser &&
                currentUser.id === OWNER_ID
                  ? `
                    <div class="actions">

                      <div class="move-buttons">

                        <button
                          class="secondary"
                          onclick="moveFeat('${feat.id}', 'up')"
                          ${canMoveUp ? "" : "disabled"}
                        >
                          ↑
                        </button>

                        <button
                          class="secondary"
                          onclick="moveFeat('${feat.id}', 'down')"
                          ${canMoveDown ? "" : "disabled"}
                        >
                          ↓
                        </button>

                      </div>

                      <button
                        class="secondary"
                        onclick="openEditModal('${feat.id}')"
                      >
                        Edit
                      </button>

                      <button
                        class="danger"
                        onclick="deleteFeat('${feat.id}')"
                      >
                        Delete
                      </button>

                    </div>
                  `
                  : ""
              }

            </div>

            <div
              class="thumbnail"
              style="${thumbnail}"
            ></div>

          </div>
        `;
      });
    }


    if (!html) {

      html =
        `<div class="empty">
          No feats found.
        </div>`;

    }


    document.getElementById("featList")
      .innerHTML = html;

    document
      .querySelectorAll(".feat.clickable")
      .forEach(card => {

        card.addEventListener("click", event => {

          if (event.target.closest("button, a")) {
            return;
          }

          const url = card.dataset.proofUrl;

          if (url) {
            window.open(url, "_blank", "noopener");
          }

        });

      });
  }


  /* =========================
     MOVE FEAT
  ========================= */

  async function moveFeat(id, direction) {

    if (
      !currentUser ||
      currentUser.id !== OWNER_ID
    ) {
      alert("You must be logged in.");
      return;
    }


    const current =
      feats.find(
        feat => String(feat.id) === String(id)
      );


    if (!current) {
      alert("Feat not found.");
      return;
    }


    /*
      Get every feat in this difficulty tier.
    */

    const tier =
      getTierFeats(current.difficulty);


    /*
      Normalize placements.

      This fixes existing feats that were
      created before the placement column
      existed and therefore have NULL placement.
    */

    let needsNormalization = false;

    for (let i = 0; i < tier.length; i++) {

      if (
        Number(tier[i].placement) !== i + 1
      ) {
        needsNormalization = true;
        break;
      }

    }


    if (needsNormalization) {

      for (let i = 0; i < tier.length; i++) {

        const {
          error
        } = await supabaseClient
          .from("feats")
          .update({
            placement: i + 1
          })
          .eq("id", tier[i].id);


        if (error) {

          console.error(error);

          alert(
            "Could not save placement:\n\n" +
            error.message
          );

          return;
        }

      }


      /*
        Update our local copy too.
      */

      tier.forEach((feat, index) => {
        feat.placement = index + 1;
      });

    }


    /*
      Find the current feat again.
    */

    const currentIndex =
      tier.findIndex(
        feat => String(feat.id) === String(id)
      );


    if (currentIndex === -1) {
      return;
    }


    const targetIndex =
      direction === "up"
        ? currentIndex - 1
        : currentIndex + 1;


    /*
      Already at the top/bottom.
    */

    if (
      targetIndex < 0 ||
      targetIndex >= tier.length
    ) {
      return;
    }


    const target =
      tier[targetIndex];


    const currentPlacement =
      Number(tier[currentIndex].placement);

    const targetPlacement =
      Number(target.placement);


    /*
      Temporary value prevents conflicts
      if a unique constraint is ever added.
    */

    const temporaryPlacement =
      tier.length + 1000;


    /*
      1. Move current out of the way.
    */

    let result =
      await supabaseClient
        .from("feats")
        .update({
          placement: temporaryPlacement
        })
        .eq("id", current.id);


    if (result.error) {

      alert(
        "Could not move feat:\n\n" +
        result.error.message
      );

      return;
    }


    /*
      2. Give target the current position.
    */

    result =
      await supabaseClient
        .from("feats")
        .update({
          placement: currentPlacement
        })
        .eq("id", target.id);


    if (result.error) {

      alert(
        "Could not move feat:\n\n" +
        result.error.message
      );

      return;
    }


    /*
      3. Give current the target position.
    */

    result =
      await supabaseClient
        .from("feats")
        .update({
          placement: targetPlacement
        })
        .eq("id", current.id);


    if (result.error) {

      alert(
        "Could not move feat:\n\n" +
        result.error.message
      );

      return;
    }


    /*
      Reload everything from Supabase.
    */

    await loadFeats();
  }


  /* =========================
     ADD FEAT
  ========================= */

  function openAddModal() {

    if (
      !currentUser ||
      currentUser.id !== OWNER_ID
    ) {
      return;
    }

    document.getElementById("modalTitle")
      .textContent = "Add Feat";

    document.getElementById("editId")
      .value = "";

    document.getElementById("featName")
      .value = "";

    document.getElementById("featGame")
      .value = "";

    document.getElementById("featDifficulty")
      .value = "Extreme";

    document.getElementById("featDate")
      .value = "";

    document.getElementById("featDescription")
      .value = "";

    document.getElementById("featProof")
      .value = "";

    document.getElementById("featThumbnail")
      .value = "";

    document.getElementById("saveError")
      .textContent = "";

    document.getElementById("featModal")
      .classList.add("open");
  }


  /* =========================
     EDIT FEAT
  ========================= */

  function openEditModal(id) {

    if (
      !currentUser ||
      currentUser.id !== OWNER_ID
    ) {
      return;
    }


    const feat =
      feats.find(
        f => String(f.id) === String(id)
      );


    if (!feat) {
      return;
    }


    document.getElementById("modalTitle")
      .textContent = "Edit Feat";

    document.getElementById("editId")
      .value = feat.id;

    document.getElementById("featName")
      .value = feat.name || "";

    document.getElementById("featGame")
      .value = feat.game || "";

    document.getElementById("featDifficulty")
      .value =
        feat.difficulty || "Extreme";

    document.getElementById("featDate")
      .value = feat.date || "";

    document.getElementById("featDescription")
      .value = feat.description || "";

    document.getElementById("featProof")
      .value = feat.proof_url || "";

    document.getElementById("featThumbnail")
      .value = feat.thumbnail_url || "";

    document.getElementById("saveError")
      .textContent = "";

    document.getElementById("featModal")
      .classList.add("open");
  }


  /* =========================
     SAVE FEAT
  ========================= */

  async function saveFeat() {

    if (
      !currentUser ||
      currentUser.id !== OWNER_ID
    ) {
      return;
    }


    const editId =
      document.getElementById("editId")
        .value;


    const difficulty =
      document.getElementById("featDifficulty")
        .value;


    const featData = {

      name:
        document.getElementById("featName")
          .value
          .trim(),

      game:
        document.getElementById("featGame")
          .value
          .trim(),

      difficulty,

      date:
        document.getElementById("featDate")
          .value || null,

      description:
        document.getElementById("featDescription")
          .value
          .trim(),

      proof_url:
        document.getElementById("featProof")
          .value
          .trim() || null,

      thumbnail_url:
        document.getElementById("featThumbnail")
          .value
          .trim() || null
    };


    const errorBox =
      document.getElementById("saveError");

    errorBox.textContent = "";


    if (!featData.name) {

      errorBox.textContent =
        "Name is required.";

      return;
    }


    /*
      ADD
    */

    if (!editId) {

      const sameTier =
        feats.filter(
          feat =>
            feat.difficulty === difficulty
        );


      const maxPlacement =
        sameTier.reduce(
          (max, feat) => {

            const placement =
              Number(feat.placement) || 0;

            return Math.max(
              max,
              placement
            );

          },
          0
        );


      featData.placement =
        maxPlacement + 1;


      const {
        error
      } = await supabaseClient
        .from("feats")
        .insert(featData);


      if (error) {

        console.error(error);

        errorBox.textContent =
          error.message;

        return;
      }

    }


    /*
      EDIT
    */

    else {

      const oldFeat =
        feats.find(
          feat =>
            String(feat.id) === String(editId)
        );


      /*
        If difficulty changed,
        put it at the bottom of the
        new difficulty tier.
      */

      if (
        oldFeat &&
        oldFeat.difficulty !== difficulty
      ) {

        const sameTier =
          feats.filter(
            feat =>
              feat.difficulty === difficulty &&
              String(feat.id) !== String(editId)
          );


        const maxPlacement =
          sameTier.reduce(
            (max, feat) => {

              const placement =
                Number(feat.placement) || 0;

              return Math.max(
                max,
                placement
              );

            },
            0
          );


        featData.placement =
          maxPlacement + 1;

      }


      const {
        error
      } = await supabaseClient
        .from("feats")
        .update(featData)
        .eq("id", editId);


      if (error) {

        console.error(error);

        errorBox.textContent =
          error.message;

        return;
      }

    }


    closeFeatModal();

    await loadFeats();
  }


  /* =========================
     DELETE
  ========================= */

  async function deleteFeat(id) {

    if (
      !currentUser ||
      currentUser.id !== OWNER_ID
    ) {
      return;
    }


    const feat =
      feats.find(
        f => String(f.id) === String(id)
      );


    if (!feat) {
      return;
    }


    const confirmed =
      confirm(
        `Delete "${feat.name}"?`
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await supabaseClient
      .from("feats")
      .delete()
      .eq("id", id);


    if (error) {

      alert(
        "Could not delete feat:\n\n" +
        error.message
      );

      return;
    }


    await loadFeats();
  }


  /* =========================
     MODALS
  ========================= */

  function openLoginModal() {

    document.getElementById("loginError")
      .textContent = "";

    document.getElementById("loginModal")
      .classList.add("open");
  }


  function closeLoginModal() {

    document.getElementById("loginModal")
      .classList.remove("open");
  }


  function closeFeatModal() {

    document.getElementById("featModal")
      .classList.remove("open");
  }


  /* =========================
     SEARCH / FILTER
  ========================= */

  document.getElementById("search")
    .addEventListener(
      "input",
      render
    );


  document.getElementById("difficultyFilter")
    .addEventListener(
      "change",
      render
    );


  /* =========================
     SECURITY / HTML ESCAPING
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  /* =========================
     START
  ========================= */

  async function start() {

    await checkAuth();

    await loadFeats();

  }


  start();

</script>
