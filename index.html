<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oosmafeats</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: #eee;
  font-family: Arial, sans-serif;
}

header {
  padding: 45px 7% 30px;
  border-bottom: 1px solid #25252c;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}

.logo {
  font-size: 36px;
  font-weight: bold;
}

.subtitle {
  color: #888;
  margin-top: 6px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

#authStatus {
  color: #888;
  font-size: 13px;
}

main {
  width: min(1200px, 90%);
  margin: 35px auto 70px;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

input,
select,
textarea,
button {
  font: inherit;
  border: 1px solid #303039;
  background: #15151b;
  color: white;
  border-radius: 9px;
  padding: 11px 13px;
}

.search {
  flex: 1;
  min-width: 220px;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.add {
  background: white;
  color: black;
  font-weight: bold;
}

/* =========================
   FEAT LIST
========================= */

.grid {
  display: flex;
  flex-direction: column;
}

/* =========================
   DIFFICULTY CATEGORY
========================= */

.tier {
  margin: 48px 0 18px;
}

.tier:first-child {
  margin-top: 0;
}

.tier-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;

  color: #aaa;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 3px;
  text-align: center;
}

.tier-title::before,
.tier-title::after {
  content: "";
  height: 1px;
  background: #292931;
  flex: 1;
}

.tier-title span {
  flex-shrink: 0;
}

/* =========================
   FEAT CARD
========================= */

.card {
  position: relative;
  overflow: hidden;

  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;

  min-height: 245px;
  margin-bottom: 14px;

  background: #121217;
  border: 1px solid #292931;
  border-radius: 14px;

  transition:
    border-color 0.15s ease,
    transform 0.15s ease;
}

.card:hover {
  border-color: #45454f;
  transform: translateY(-1px);
}

/* =========================
   CARD CONTENT
========================= */

.card-content {
  padding: 27px 30px;
  min-width: 0;

  display: flex;
  flex-direction: column;
}

.card-top {
  display: flex;
  align-items: flex-start;
  gap: 18px;
}

/* POINTERCRATE-STYLE PLACEMENT NUMBER */

.placement {
  flex-shrink: 0;

  min-width: 52px;

  color: #777;
  font-size: 27px;
  font-weight: bold;
  line-height: 1;

  padding-top: 3px;
  text-align: right;
}

.feat-info {
  min-width: 0;
}

.game {
  color: #888;
  font-size: 13px;
  margin-bottom: 7px;
}

.name {
  font-size: 30px;
  font-weight: bold;
  line-height: 1.15;
  color: #fff;
  margin-bottom: 14px;
}

.description {
  color: #ccc;
  line-height: 1.55;
  font-size: 15px;
  margin: 0 0 20px;
  max-width: 850px;
}

/* =========================
   META
========================= */

.meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: auto;
}

.pill {
  display: inline-flex;
  align-items: center;

  background: #1b1b22;
  border: 1px solid #303039;

  border-radius: 20px;
  padding: 6px 10px;

  font-size: 12px;
  color: #ccc;
}

.proof {
  color: #bbb;
  text-decoration: none;
}

.actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.actions button {
  font-size: 12px;
  padding: 7px 10px;
}

/* =========================
   THUMBNAIL
========================= */

.thumbnail {
  position: relative;

  min-height: 245px;

  overflow: hidden;

  background: #09090c;
  border-left: 1px solid #292931;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  min-height: 245px;

  display: block;

  object-fit: cover;
}

.thumbnail::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      90deg,
      rgba(18,18,23,0.35),
      rgba(18,18,23,0)
    );

  pointer-events: none;
}

/* =========================
   EMPTY
========================= */

.empty {
  text-align: center;
  color: #777;

  padding: 70px 10px;

  border: 1px dashed #292931;
  border-radius: 14px;
}

/* =========================
   IMAGE UPLOAD
========================= */

.image-upload {
  display: grid;
  gap: 8px;
}

.image-upload input[type="file"] {
  width: 100%;
  padding: 10px;
  cursor: pointer;
}

.image-preview {
  display: none;

  width: 100%;
  height: 150px;

  object-fit: cover;

  border-radius: 10px;
  border: 1px solid #303039;
}

.image-preview.show {
  display: block;
}

.image-help {
  color: #777;
  font-size: 11px;
}

/* =========================
   MODALS
========================= */

.modal {
  display: none;

  position: fixed;
  inset: 0;

  background: #000b;

  align-items: center;
  justify-content: center;

  padding: 20px;

  z-index: 100;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: min(520px, 100%);
  max-height: 90vh;

  overflow-y: auto;

  background: #111116;

  border: 1px solid #292931;
  border-radius: 16px;

  padding: 25px;
}

.modal-box h2 {
  margin-top: 0;
}

form {
  display: grid;
  gap: 12px;
}

label {
  color: #999;
  font-size: 12px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.form-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.error {
  color: #ff7777;
  font-size: 13px;
  display: none;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 750px) {

  .card {
    grid-template-columns: 1fr;
  }

  .thumbnail {
    order: -1;

    height: 210px;
    min-height: 210px;

    border-left: none;
    border-bottom: 1px solid #292931;
  }

  .thumbnail img {
    min-height: 210px;
  }

  .card-content {
    padding: 22px;
  }

  .name {
    font-size: 25px;
  }

  .placement {
    min-width: 42px;
    font-size: 23px;
  }
}

@media(max-width: 600px) {

  .row {
    grid-template-columns: 1fr;
  }

  header {
    flex-direction: column;
  }

  main {
    width: 92%;
  }

  .card-top {
    gap: 12px;
  }

  .placement {
    min-width: 35px;
    font-size: 20px;
  }

  .tier-title {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>

  <div>
    <div class="logo">OOSMAFEATS</div>
    <div class="subtitle">All my feats.</div>
  </div>

  <div class="header-actions">

    <span id="authStatus">
      Not logged in
    </span>

    <button
      id="authButton"
      type="button"
      onclick="openAuthModal()"
    >
      Login
    </button>

  </div>

</header>

<main>

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search feats or games..."
    >

    <select id="filter">
      <option value="">All difficulties</option>
      <option>Easy</option>
      <option>Normal</option>
      <option>Hard</option>
      <option>Insane</option>
      <option>Extreme</option>
    </select>

    <button
      id="addButton"
      class="add"
      type="button"
      onclick="handleAddClick()"
    >
      + Add Feat
    </button>

  </div>

  <div id="grid" class="grid"></div>

</main>

<!-- FEAT MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="modalTitle">Add Feat</h2>

    <form id="featForm">

      <input type="hidden" id="editId">

      <div class="row">

        <div>

          <label>FEAT NAME</label>

          <input
            id="name"
            required
            placeholder="Example: Dark Souls II SL1"
          >

        </div>

        <div>

          <label>GAME</label>

          <input
            id="game"
            required
            placeholder="Example: Dark Souls II"
          >

        </div>

      </div>

      <div>

        <label>DIFFICULTY</label>

        <select id="difficulty">

          <option>Easy</option>
          <option>Normal</option>
          <option>Hard</option>
          <option>Insane</option>
          <option>Extreme</option>

        </select>

      </div>

      <div>

        <label>DATE COMPLETED</label>

        <input
          id="date"
          type="date"
        >

      </div>

      <div>

        <label>DESCRIPTION</label>

        <textarea
          id="description"
          placeholder="Describe the feat..."
        ></textarea>

      </div>

      <div>

        <label>PROOF URL</label>

        <input
          id="proof"
          type="url"
          placeholder="https://youtube.com/..."
        >

      </div>

      <div class="image-upload">

        <label>CUSTOM THUMBNAIL</label>

        <input
          id="thumbnailFile"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/gif"
        >

        <div class="image-help">
          Upload an image to use on the right side of the feat card.
          If you upload one, it will override the YouTube thumbnail.
        </div>

        <img
          id="imagePreview"
          class="image-preview"
          alt="Thumbnail preview"
        >

      </div>

      <div class="form-buttons">

        <button
          type="button"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="add"
          type="submit"
          id="saveButton"
        >
          Save Feat
        </button>

      </div>

    </form>

  </div>

</div>

<!-- LOGIN MODAL -->

<div id="authModal" class="modal">

  <div class="modal-box">

    <h2>Login</h2>

    <form id="authForm">

      <div>

        <label>EMAIL</label>

        <input
          id="authEmail"
          type="email"
          required
          placeholder="Your email"
        >

      </div>

      <div>

        <label>PASSWORD</label>

        <input
          id="authPassword"
          type="password"
          required
          placeholder="Your password"
        >

      </div>

      <div
        id="authError"
        class="error"
      ></div>

      <div class="form-buttons">

        <button
          type="button"
          onclick="closeAuthModal()"
        >
          Cancel
        </button>

        <button
          class="add"
          type="submit"
        >
          Login
        </button>

      </div>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://qptsfclqcoqmlsegkbpt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_HN6LCZdOXz1Y2jNwBFOzCg_qipdKvev";

const OWNER_ID =
  "d308964b-015f-48f1-a9b2-196c6812f654";

const IMAGE_BUCKET =
  "feat-images";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let feats = [];
let currentUser = null;
let selectedThumbnailFile = null;


/* =========================
   AUTH
========================= */

async function checkAuth() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();

  currentUser =
    session ? session.user : null;

  updateAuthUI();

}


supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    currentUser =
      session ? session.user : null;

    updateAuthUI();
    render();

  }
);


function updateAuthUI() {

  const status =
    document.getElementById("authStatus");

  const button =
    document.getElementById("authButton");

  const addButton =
    document.getElementById("addButton");

  if (
    currentUser &&
    currentUser.id === OWNER_ID
  ) {

    status.textContent =
      "Logged in";

    button.textContent =
      "Logout";

    button.onclick =
      logout;

    addButton.disabled =
      false;

  } else {

    status.textContent =
      "Not logged in";

    button.textContent =
      "Login";

    button.onclick =
      openAuthModal;

    addButton.disabled =
      true;

  }

}


function openAuthModal() {

  document
    .getElementById("authModal")
    .classList.add("open");

  document
    .getElementById("authEmail")
    .focus();

}


function closeAuthModal() {

  document
    .getElementById("authModal")
    .classList.remove("open");

  document
    .getElementById("authError")
    .style.display =
      "none";

}


async function logout() {

  const { error } =
    await supabaseClient.auth.signOut();

  if (error) {

    alert(
      "Logout failed: " +
      error.message
    );

  }

}


document
  .getElementById("authForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const email =
        document
          .getElementById("authEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("authPassword")
          .value;

      const errorBox =
        document.getElementById("authError");

      errorBox.style.display =
        "none";

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        errorBox.textContent =
          error.message;

        errorBox.style.display =
          "block";

        return;

      }

      if (
        !data.user ||
        data.user.id !== OWNER_ID
      ) {

        await supabaseClient.auth.signOut();

        errorBox.textContent =
          "This account is not authorized.";

        errorBox.style.display =
          "block";

        return;

      }

      closeAuthModal();

    }
  );


/* =========================
   LOAD FEATS
========================= */

async function loadFeats() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("feats")
      .select("*")
      .order(
        "created_at",
        {
          ascending: true
        }
      );

  if (error) {

    console.error(
      "Failed to load feats:",
      error
    );

    document.getElementById("grid").innerHTML = `
      <div class="empty">
        Failed to load feats.<br><br>
        Check the browser console for details.
      </div>
    `;

    return;

  }

  feats =
    data || [];

  render();

}


/* =========================
   ADD / EDIT
========================= */

function handleAddClick() {

  if (!currentUser) {

    openAuthModal();
    return;

  }

  if (
    currentUser.id !== OWNER_ID
  ) {

    alert(
      "You are not authorized."
    );

    return;

  }

  openModal();

}


function openModal(id = null) {

  if (
    !currentUser ||
    currentUser.id !== OWNER_ID
  ) {

    openAuthModal();
    return;

  }

  document
    .getElementById("modal")
    .classList.add("open");

  document
    .getElementById("editId")
    .value =
    id !== null
      ? String(id)
      : "";

  document
    .getElementById("modalTitle")
    .textContent =
    id !== null
      ? "Edit Feat"
      : "Add Feat";

  selectedThumbnailFile =
    null;

  document
    .getElementById("thumbnailFile")
    .value =
    "";

  const preview =
    document.getElementById("imagePreview");

  preview.src = "";
  preview.classList.remove("show");

  if (id !== null) {

    const feat =
      feats.find(
        f =>
          String(f.id) === String(id)
      );

    if (!feat) {

      closeModal();
      return;

    }

    document.getElementById("name").value =
      feat.name || "";

    document.getElementById("game").value =
      feat.game || "";

    document.getElementById("difficulty").value =
      feat.difficulty || "Normal";

    document.getElementById("date").value =
      feat.date || "";

    document.getElementById("description").value =
      feat.description || "";

    document.getElementById("proof").value =
      feat.proof_url || "";

    if (feat.thumbnail_url) {

      preview.src =
        feat.thumbnail_url;

      preview.classList.add("show");

    }

  } else {

    document
      .getElementById("featForm")
      .reset();

  }

  document
    .getElementById("name")
    .focus();

}


function closeModal() {

  document
    .getElementById("modal")
    .classList.remove("open");

}


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("thumbnailFile")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if (!file) {

        selectedThumbnailFile =
          null;

        return;

      }

      if (
        !file.type.startsWith("image/")
      ) {

        alert(
          "Please select an image file."
        );

        event.target.value =
          "";

        return;

      }

      if (
        file.size > 10 * 1024 * 1024
      ) {

        alert(
          "Image must be smaller than 10 MB."
        );

        event.target.value =
          "";

        return;

      }

      selectedThumbnailFile =
        file;

      const reader =
        new FileReader();

      reader.onload =
        e => {

          const preview =
            document.getElementById(
              "imagePreview"
            );

          preview.src =
            e.target.result;

          preview.classList.add(
            "show"
          );

        };

      reader.readAsDataURL(file);

    }
  );


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadThumbnail(
  file,
  featId
) {

  if (!file) {
    return null;
  }

  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth.getSession();

  if (sessionError) {
    throw sessionError;
  }

  const session =
    sessionData.session;

  if (!session) {

    throw new Error(
      "Your login session has expired. Please log in again."
    );

  }

  if (
    session.user.id !== OWNER_ID
  ) {

    throw new Error(
      "You are not authorized to upload images."
    );

  }

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const filePath =
    session.user.id +
    "/" +
    featId +
    "-" +
    Date.now() +
    "." +
    extension;

  const {
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from(IMAGE_BUCKET)
      .upload(
        filePath,
        file,
        {
          upsert: false,
          contentType: file.type,
          cacheControl: "3600"
        }
      );

  if (uploadError) {

    console.error(
      "Image upload failed:",
      uploadError
    );

    throw uploadError;

  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from(IMAGE_BUCKET)
      .getPublicUrl(
        filePath
      );

  if (
    !data ||
    !data.publicUrl
  ) {

    throw new Error(
      "Image uploaded, but no public URL was returned."
    );

  }

  return data.publicUrl;

}


/* =========================
   SAVE FEAT
========================= */

document
  .getElementById("featForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (
        !currentUser ||
        currentUser.id !== OWNER_ID
      ) {

        alert(
          "You must be logged in as the owner."
        );

        return;

      }

      const saveButton =
        document.getElementById(
          "saveButton"
        );

      saveButton.disabled =
        true;

      saveButton.textContent =
        "Saving...";

      try {

        const id =
          document
            .getElementById("editId")
            .value;

        const featData = {

          name:
            document
              .getElementById("name")
              .value
              .trim(),

          game:
            document
              .getElementById("game")
              .value
              .trim(),

          difficulty:
            document
              .getElementById("difficulty")
              .value,

          date:
            document
              .getElementById("date")
              .value ||
            null,

          description:
            document
              .getElementById("description")
              .value
              .trim(),

          proof_url:
            document
              .getElementById("proof")
              .value
              .trim() ||
            null

        };

        let savedFeatId =
          id;

        /* ADD */

        if (!id) {

          const {
            data,
            error
          } =
            await supabaseClient
              .from("feats")
              .insert(
                featData
              )
              .select()
              .single();

          if (error) {
            throw error;
          }

          savedFeatId =
            data.id;

        }

        /* EDIT */

        else {

          const {
            error
          } =
            await supabaseClient
              .from("feats")
              .update(
                featData
              )
              .eq(
                "id",
                id
              );

          if (error) {
            throw error;
          }

        }

        /* UPLOAD THUMBNAIL */

        if (
          selectedThumbnailFile
        ) {

          const thumbnailURL =
            await uploadThumbnail(
              selectedThumbnailFile,
              savedFeatId
            );

          const {
            error
          } =
            await supabaseClient
              .from("feats")
              .update({
                thumbnail_url:
                  thumbnailURL
              })
              .eq(
                "id",
                savedFeatId
              );

          if (error) {
            throw error;
          }

        }

        closeModal();

        selectedThumbnailFile =
          null;

        await loadFeats();

      } catch (error) {

        console.error(
          "Failed to save feat:",
          error
        );

        alert(
          "Failed to save feat:\n\n" +
          error.message
        );

      } finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "Save Feat";

      }

    }
  );


/* =========================
   DELETE
========================= */

async function deleteFeat(id) {

  if (
    !currentUser ||
    currentUser.id !== OWNER_ID
  ) {

    alert(
      "You must be logged in as the owner."
    );

    return;

  }

  if (
    !confirm(
      "Delete this feat?"
    )
  ) {

    return;

  }

  const {
    error
  } =
    await supabaseClient
      .from("feats")
      .delete()
      .eq(
        "id",
        id
      );

  if (error) {

    console.error(
      "Failed to delete feat:",
      error
    );

    alert(
      "Failed to delete feat:\n\n" +
      error.message
    );

    return;

  }

  await loadFeats();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

  return String(text).replace(
    /[&<>"']/g,
    char => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    })[char]
  );

}


/* =========================
   SAFE URL
========================= */

function safeURL(value) {

  if (!value) {
    return "";
  }

  try {

    const url =
      new URL(value);

    if (
      url.protocol === "http:" ||
      url.protocol === "https:"
    ) {

      return url.href;

    }

  } catch (error) {
  }

  return "";

}


/* =========================
   YOUTUBE THUMBNAIL
========================= */

function getYouTubeThumbnail(value) {

  if (!value) {
    return "";
  }

  try {

    const url =
      new URL(value);

    let videoId =
      "";

    if (
      url.hostname.includes(
        "youtube.com"
      )
    ) {

      videoId =
        url.searchParams.get("v") ||
        "";

      if (
        !videoId &&
        url.pathname.startsWith(
          "/shorts/"
        )
      ) {

        videoId =
          url.pathname
            .split("/shorts/")[1]
            .split("/")[0];

      }

      if (
        !videoId &&
        url.pathname.startsWith(
          "/embed/"
        )
      ) {

        videoId =
          url.pathname
            .split("/embed/")[1]
            .split("/")[0];

      }

    }

    if (
      url.hostname === "youtu.be"
    ) {

      videoId =
        url.pathname
          .replace("/", "")
          .split("/")[0];

    }

    if (!videoId) {
      return "";
    }

    return (
      "https://img.youtube.com/vi/" +
      encodeURIComponent(videoId) +
      "/hqdefault.jpg"
    );

  } catch (error) {

    return "";

  }

}


/* =========================
   DIFFICULTY ORDER
========================= */

const difficultyOrder = {

  "Extreme": 1,
  "Insane": 2,
  "Hard": 3,
  "Normal": 4,
  "Easy": 5

};


/* =========================
   RENDER
========================= */

function render() {

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const selectedDifficulty =
    document
      .getElementById("filter")
      .value;

  /*
   * FIRST:
   * filter the feats
   */

  const filtered =
    feats.filter(
      feat => {

        const matchesSearch =
          !query ||
          (
            (feat.name || "") +
            " " +
            (feat.game || "") +
            " " +
            (feat.description || "")
          )
          .toLowerCase()
          .includes(query);

        const matchesDifficulty =
          !selectedDifficulty ||
          feat.difficulty ===
            selectedDifficulty;

        return (
          matchesSearch &&
          matchesDifficulty
        );

      }
    );

  /*
   * SORT BY DIFFICULTY
   *
   * Extreme first
   * Insane second
   * Hard third
   * etc.
   */

  filtered.sort(
    (a, b) => {

      const aOrder =
        difficultyOrder[
          a.difficulty
        ] || 999;

      const bOrder =
        difficultyOrder[
          b.difficulty
        ] || 999;

      if (
        aOrder !== bOrder
      ) {

        return (
          aOrder -
          bOrder
        );

      }

      /*
       * Within the same
       * difficulty, newest
       * feats appear first.
       */

      return (
        new Date(
          b.created_at || 0
        ) -
        new Date(
          a.created_at || 0
        )
      );

    }
  );

  const grid =
    document.getElementById(
      "grid"
    );

  if (!filtered.length) {

    grid.innerHTML = `
      <div class="empty">

        No feats yet.

        <br><br>

        ${
          currentUser
            ? 'Click <b>+ Add Feat</b> to add one.'
            : 'Login to add a feat.'
        }

      </div>
    `;

    return;

  }

  /*
   * DISPLAY NUMBER
   *
   * This is the important
   * Pointercrate-style part.
   *
   * #1 = hardest
   * #2 = second hardest
   * etc.
   *
   * There is NO maximum.
   */

  let html = "";

  let placement =
    1;

  let currentDifficulty =
    null;

  filtered.forEach(
    feat => {

      /*
       * Add centered category
       * whenever difficulty changes.
       */

      if (
        feat.difficulty !==
        currentDifficulty
      ) {

        currentDifficulty =
          feat.difficulty;

        html += `

          <div class="tier">

            <div class="tier-title">

              <span>
                ${escapeHTML(
                  currentDifficulty ||
                  "UNRANKED"
                )}
              </span>

            </div>

          </div>

        `;

      }

      const proofURL =
        safeURL(
          feat.proof_url
        );

      /*
       * Custom thumbnail first.
       * YouTube thumbnail second.
       */

      const thumbnail =
        safeURL(
          feat.thumbnail_url
        ) ||
        getYouTubeThumbnail(
          feat.proof_url
        );

      const thumbnailHTML =
        thumbnail
          ? `

            <div class="thumbnail">

              <img
                src="${escapeHTML(thumbnail)}"
                alt=""
                loading="lazy"
              >

            </div>

          `
          : `

            <div class="thumbnail"></div>

          `;

      html += `

        <article class="card">

          <div class="card-content">

            <div class="card-top">

              <div class="placement">
                #${placement}
              </div>

              <div class="feat-info">

                <div class="game">
                  ${escapeHTML(
                    feat.game || ""
                  )}
                </div>

                <div class="name">
                  ${escapeHTML(
                    feat.name || ""
                  )}
                </div>

                ${
                  feat.description
                    ? `

                      <div class="description">

                        ${escapeHTML(
                          feat.description
                        )}

                      </div>

                    `
                    : ""
                }

              </div>

            </div>

            <div class="meta">

              <span class="pill">

                ${escapeHTML(
                  feat.difficulty || ""
                )}

              </span>

              ${
                feat.date
                  ? `

                    <span class="pill">

                      ${escapeHTML(
                        feat.date
                      )}

                    </span>

                  `
                  : ""
              }

              ${
                proofURL
                  ? `

                    <a
                      class="proof"
                      href="${escapeHTML(
                        proofURL
                      )}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >

                      <button type="button">
                        Proof ↗
                      </button>

                    </a>

                  `
                  : ""
              }

            </div>

            ${
              currentUser &&
              currentUser.id === OWNER_ID
                ? `

                  <div class="actions">

                    <button
                      type="button"
                      onclick="openModal('${feat.id}')"
                    >
                      Edit
                    </button>

                    <button
                      type="button"
                      onclick="deleteFeat('${feat.id}')"
                    >
                      Delete
                    </button>

                  </div>

                `
                : ""
            }

          </div>

          ${thumbnailHTML}

        </article>

      `;

      placement++;

    }
  );

  grid.innerHTML =
    html;

}


/* =========================
   SEARCH / FILTER
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );

document
  .getElementById("filter")
  .addEventListener(
    "change",
    render
  );


/* =========================
   MODAL BACKDROPS
========================= */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "modal"
      ) {

        closeModal();

      }

    }
  );


document
  .getElementById("authModal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "authModal"
      ) {

        closeAuthModal();

      }

    }
  );


/* =========================
   START
========================= */

async function startApp() {

  await checkAuth();
  await loadFeats();

}

startApp();

</script>
